                      if (!isStopped) {
                          prefs.edit().putString("last_error", "OK").apply()
                          callback.done()
                      }
                  } catch (e: Exception) {
                      prefs.edit().putString("last_error", e.message ?: "Unknown error").apply()
                      callback.error()
                  }
              }
          }
          EOF

